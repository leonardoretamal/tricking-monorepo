name: Deploy

# Despliega la app en Cloudflare Workers con OpenNext en cada push a main.
# Requiere los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID en GitHub.
# Las variables de runtime (DATABASE_URL, keys de IA, etc.) se cargan una vez con
# `wrangler secret put` o desde el panel de Cloudflare.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Desplegar en Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Variables publicas que Next inlinea en el BUILD (no en runtime).
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      # El sitemap consulta la base en build; si falta, cae a las rutas estaticas.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build con OpenNext
        run: pnpm --filter @tricking/web cf:build

      - name: Desplegar en Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          packageManager: pnpm
          command: deploy
