name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-format-build:
    name: Lint, formato y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Verificar formato
        run: pnpm exec prettier --check .

      - name: Build
        run: pnpm build

  test:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

  i18n:
    name: Validacion de claves i18n
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificar paridad de claves
        run: pnpm --filter @tricking/web i18n:check

  e2e:
    name: Pruebas E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Cachear navegadores de Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Instalar navegador de Playwright
        run: pnpm exec playwright install --with-deps chromium

      # Las pruebas de trucos consultan la base en tiempo real. Si el secreto
      # DATABASE_URL no esta configurado, solo se ejecutan las pruebas de layout que
      # no dependen de la base, y se avisa en el log.
      - name: Ejecutar pruebas E2E
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Sin DATABASE_URL configurado: se omiten las pruebas E2E que dependen de la base y se ejecutan solo las de layout."
            pnpm exec playwright test e2e/base.spec.ts
          else
            pnpm exec playwright test
          fi
